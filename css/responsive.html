<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>반응형 웹 미디어 쿼리</title>
<style>
  body { font-family: sans-serif; line-height: 1.6; max-width: 700px; margin: 40px auto; padding: 0 20px; color: #333; }
  h1 { color: #2980b9; }
  section { margin-bottom: 30px; padding: 15px; border: 1px solid #ddd; border-radius: 8px; }
  .demo { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
  .demo div { background: #2980b9; color: white; padding: 20px; text-align: center; border-radius: 6px; }
  .status { font-weight: bold; color: #2980b9; }

  /* 화면 너비 600px 이하에서는 1열로 쌓임 */
  @media (max-width: 600px) {
    .demo { grid-template-columns: 1fr; }
    .status::after { content: " (현재: 모바일 레이아웃, 1열)"; }
  }
  @media (min-width: 601px) {
    .status::after { content: " (현재: 데스크톱 레이아웃, 3열)"; }
  }
  code { background: #f4f4f4; padding: 2px 6px; border-radius: 4px; display: block; margin-top: 10px; white-space: pre-wrap; }
  a.back { display: inline-block; margin-top: 20px; }
</style>
</head>
<body>
  <h1>반응형 웹 미디어 쿼리</h1>

  <section>
    <h2>화면 크기에 따라 열 개수가 바뀌는 그리드</h2>
    <p class="status">브라우저 창 크기를 줄여보세요.</p>
    <div class="demo">
      <div>1</div><div>2</div><div>3</div>
    </div>
    <code>@media (max-width: 600px) {
  .demo { grid-template-columns: 1fr; }
}</code>
  </section>

  <a class="back" href="../index.html">&larr; 메인으로 돌아가기</a>
</body>
</html>
