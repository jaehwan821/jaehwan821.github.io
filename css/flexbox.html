<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flexbox 레이아웃 배치</title>
<style>
  body { font-family: sans-serif; line-height: 1.6; max-width: 700px; margin: 40px auto; padding: 0 20px; color: #333; }
  h1 { color: #2980b9; }
  section { margin-bottom: 30px; padding: 15px; border: 1px solid #ddd; border-radius: 8px; }
  .row { display: flex; gap: 10px; background: #f4f7f6; padding: 10px; border-radius: 6px; margin-top: 10px; }
  .row.center { justify-content: center; }
  .row.between { justify-content: space-between; }
  .item { background: #2980b9; color: white; padding: 16px; border-radius: 6px; text-align: center; min-width: 60px; }
  code { background: #f4f4f4; padding: 2px 6px; border-radius: 4px; display: block; margin-top: 10px; }
  a.back { display: inline-block; margin-top: 20px; }
</style>
</head>
<body>
  <h1>Flexbox 레이아웃 배치</h1>

  <section>
    <h2>기본 정렬 (justify-content: flex-start)</h2>
    <div class="row"><div class="item">1</div><div class="item">2</div><div class="item">3</div></div>
    <code>display: flex; gap: 10px;</code>
  </section>

  <section>
    <h2>가운데 정렬 (justify-content: center)</h2>
    <div class="row center"><div class="item">1</div><div class="item">2</div><div class="item">3</div></div>
    <code>display: flex; justify-content: center;</code>
  </section>

  <section>
    <h2>양쪽 끝 정렬 (justify-content: space-between)</h2>
    <div class="row between"><div class="item">1</div><div class="item">2</div><div class="item">3</div></div>
    <code>display: flex; justify-content: space-between;</code>
  </section>

  <a class="back" href="../index.html">&larr; 메인으로 돌아가기</a>
</body>
</html>
