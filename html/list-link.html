<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>리스트와 하이퍼링크 (ul, a)</title>
<link rel="stylesheet" href="theme.css">
</head>
<body>
  <div class="wrap">
    <a class="back" href="../index.html">&larr; 메인으로 돌아가기</a>

    <div class="page-title">
      <span class="ico" aria-hidden="true">&lt;/&gt;</span>
      <h1 class="title">리스트와 하이퍼링크 (ul, a)</h1>
    </div>

    <section>
      <h2>순서 없는 목록 (ul, li)</h2>
      <div class="demo">
        <ul>
          <li>사과</li>
          <li>바나나</li>
          <li>딸기</li>
        </ul>
      </div>
      <code>&lt;ul&gt;&lt;li&gt;...&lt;/li&gt;&lt;/ul&gt;</code>
    </section>

    <section>
      <h2>순서 있는 목록 (ol, li)</h2>
      <div class="demo">
        <ol>
          <li>재료 준비</li>
          <li>재료 손질</li>
          <li>조리</li>
        </ol>
      </div>
      <code>&lt;ol&gt;&lt;li&gt;...&lt;/li&gt;&lt;/ol&gt;</code>
    </section>

    <section>
      <h2>하이퍼링크 (a)</h2>
      <div class="demo">
        <p>같은 사이트 안의 다른 페이지로 이동: <a href="../index.html">메인 페이지로</a></p>
        <p>외부 사이트로 이동: <a href="https://www.w3.org/" target="_blank" rel="noopener">W3C 바로가기</a> (새 창에서 열림)</p>
      </div>
      <code>&lt;a href="경로 또는 URL"&gt;텍스트&lt;/a&gt;</code>
    </section>

    <a class="back" href="../index.html">&larr; 메인으로 돌아가기</a>
  </div>
</body>
</html>
