<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>기본 태그 활용 (h1~h6, p)</title>
<style>
  body { font-family: sans-serif; line-height: 1.6; max-width: 700px; margin: 40px auto; padding: 0 20px; color: #333; }
  h1 { color: #2980b9; }
  section { margin-bottom: 30px; padding: 15px; border: 1px solid #ddd; border-radius: 8px; }
  code { background: #f4f4f4; padding: 2px 6px; border-radius: 4px; }
  a.back { display: inline-block; margin-top: 20px; }
</style>
</head>
<body>
  <h1>기본 태그 활용 (h1~h6, p)</h1>

  <section>
    <h2>제목 태그 (h1 ~ h6)</h2>
    <h1>이것은 h1 제목</h1>
    <h2>이것은 h2 제목</h2>
    <h3>이것은 h3 제목</h3>
    <h4>이것은 h4 제목</h4>
    <h5>이것은 h5 제목</h5>
    <h6>이것은 h6 제목</h6>
    <code>&lt;h1&gt;...&lt;/h1&gt; ~ &lt;h6&gt;...&lt;/h6&gt;</code>
    <p style="margin-top:10px;">숫자가 작을수록 더 중요한 제목이며 글자가 커집니다. 한 페이지에 h1은 보통 하나만 사용합니다.</p>
  </section>

  <section>
    <h2>문단 태그 (p)</h2>
    <p>p 태그는 하나의 문단을 나타냅니다. 문단 사이에는 자동으로 줄바꿈과 여백이 생깁니다.</p>
    <p>이것은 두 번째 문단입니다.</p>
    <code>&lt;p&gt;문단 내용&lt;/p&gt;</code>
  </section>

  <a class="back" href="../index.html">&larr; 메인으로 돌아가기</a>
</body>
</html>
