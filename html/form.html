<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>입력 양식 만들기 (form)</title>
<style>
  body { font-family: sans-serif; line-height: 1.6; max-width: 700px; margin: 40px auto; padding: 0 20px; color: #333; }
  h1 { color: #2980b9; }
  section { margin-bottom: 30px; padding: 15px; border: 1px solid #ddd; border-radius: 8px; }
  label { display: block; margin-top: 12px; font-weight: bold; }
  input, select, textarea { width: 100%; padding: 8px; margin-top: 4px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
  button { margin-top: 16px; background: #2980b9; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; }
  a.back { display: inline-block; margin-top: 20px; }
</style>
</head>
<body>
  <h1>입력 양식 만들기 (form)</h1>

  <section>
    <h2>간단한 설문 폼</h2>
    <form onsubmit="alert('제출 예시입니다 (실제로 전송되지 않음)'); return false;">
      <label for="name">이름</label>
      <input type="text" id="name" name="name" placeholder="홍길동" required>

      <label for="email">이메일</label>
      <input type="email" id="email" name="email" placeholder="example@school.ac.kr" required>

      <label for="major">전공</label>
      <select id="major" name="major">
        <option value="cs">컴퓨터공학</option>
        <option value="info-sec">정보보안</option>
        <option value="etc">기타</option>
      </select>

      <label for="opinion">수업 의견</label>
      <textarea id="opinion" name="opinion" rows="4" placeholder="자유롭게 입력하세요"></textarea>

      <button type="submit">제출</button>
    </form>
  </section>

  <a class="back" href="../index.html">&larr; 메인으로 돌아가기</a>
</body>
</html>
